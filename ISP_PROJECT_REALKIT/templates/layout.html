<!DOCTYPE html>
<html>
<head>
    <title>NetNeuronix</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fbff; }
        .navbar { background-color: #003366; }
        .card { border-radius: 20px; border: none; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .btn-primary { border-radius: 30px; background-color: #0056b3; border: none; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4 p-3">
        <div class="container">
            <span class="navbar-brand fw-bold">NETNEURONIX SDN</span>
            {% if session.user %}<a href="/logout" class="btn btn-outline-light btn-sm rounded-pill">Logout</a>{% endif %}
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}{% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} rounded-pill text-center shadow-sm mb-4">{{ msg }}</div>
          {% endfor %}{% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

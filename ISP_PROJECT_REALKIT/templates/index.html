{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4 card p-5 text-center shadow">
        <h3 class="fw-bold text-primary mb-4">Login</h3>
        <form action="/login" method="POST">
            <input type="text" name="username" class="form-control mb-3 rounded-pill" placeholder="Username" required>
            <input type="password" name="password" class="form-control mb-4 rounded-pill" placeholder="Password" required>
            <button class="btn btn-primary w-100 fw-bold py-2">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
